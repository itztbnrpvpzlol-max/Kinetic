name: Build modified base.apk as Kinetic
on:
  workflow_dispatch:
  push:
    paths:
      - 'baseapk-patch/**'
      - '.github/workflows/build-baseapk-kinetic.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Download the successful decompilation artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/41792310851/artifacts" -o artifacts.json
          ARTIFACT_ID=$(python3 -c "import json; d=json.load(open('artifacts.json')); print(next(a['id'] for a in d['artifacts'] if a['name']=='apk-decompiled-output' and not a['expired']))")
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o decompiled.zip
          mkdir decompiled
          unzip -q decompiled.zip -d decompiled
          test -f decompiled/apktool/apktool.yml
      - name: Install apktool
        run: |
          curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
      - name: Apply Kinetic home Activity
        run: |
          mkdir -p decompiled/apktool/res/values compiled dex-out
          cp baseapk-patch/res/values/kinetic_attrs.xml decompiled/apktool/res/values/
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path('decompiled/apktool/AndroidManifest.xml')
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          # Convert the bundle-generated base split into a standalone installable APK.
          for attr in ('isSplitRequired', 'requiredSplitTypes', 'splitTypes'):
              root.attrib.pop(ns + attr, None)
          app = root.find('application')
          for activity in list(app.findall('activity')):
              if activity.get(ns + 'name') == 'com.angkin.keyflow.MainActivity':
                  for filt in list(activity.findall('intent-filter')):
                      actions = [a.get(ns + 'name') for a in filt.findall('action')]
                      cats = [c.get(ns + 'name') for c in filt.findall('category')]
                      if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in cats:
                          activity.remove(filt)
          home = ET.SubElement(app, 'activity', {
              ns + 'name': 'com.angkin.keyflow.KineticHomeActivity',
              ns + 'exported': 'true',
              ns + 'theme': '@style/Theme.Keyflow',
              ns + 'screenOrientation': 'portrait'
          })
          filt = ET.SubElement(home, 'intent-filter')
          ET.SubElement(filt, 'action', {ns + 'name': 'android.intent.action.MAIN'})
          ET.SubElement(filt, 'category', {ns + 'name': 'android.intent.category.LAUNCHER'})
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          strings = Path('decompiled/apktool/res/values/strings.xml')
          s = strings.read_text()
          import re
          s, n = re.subn(r'<string name="app_name">.*?</string>', '<string name="app_name">Kinetic</string>', s, count=1, flags=re.S)
          if n == 0:
              raise SystemExit('Could not find app_name string')
          strings.write_text(s)
          PY
          javac -source 8 -target 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d compiled baseapk-patch/java/com/angkin/keyflow/KineticHomeActivity.java
          "$ANDROID_HOME/build-tools/36.0.0/d8" --min-api 32 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output dex-out compiled/com/angkin/keyflow/KineticHomeActivity.class
          cp dex-out/classes.dex dex-out/classes4.dex
      - name: Rebuild APK without reassembling protected original DEX files
        run: |
          java -jar apktool.jar b --no-src decompiled/apktool -o kinetic-unsigned.apk
          cd dex-out
          zip -q -u ../kinetic-unsigned.apk classes4.dex
      - name: Sign APK
        run: |
          curl -L --fail -o signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar signer.jar --apks kinetic-unsigned.apk --out signed
          cp signed/kinetic-aligned-debugSigned.apk Kinetic-baseapk-modified.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kinetic-baseapk-modified
          path: Kinetic-baseapk-modified.apk
          if-no-files-found: error
