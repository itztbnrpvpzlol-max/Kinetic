name: Build modified base.apk as Kinetic
on:
  workflow_dispatch:
  push:
    paths:
      - 'baseapk-patch/**'
      - '.github/workflows/build-baseapk-kinetic.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the successful decompilation artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/41792310851/artifacts" -o artifacts.json
          ARTIFACT_ID=$(python3 -c "import json; d=json.load(open('artifacts.json')); print(next(a['id'] for a in d['artifacts'] if a['name']=='apk-decompiled-output' and not a['expired']))")
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o decompiled.zip
          mkdir decompiled
          unzip -q decompiled.zip -d decompiled
          test -f decompiled/apktool/apktool.yml
          test -f decompiled/apktool/smali/com/angkin/keyflow/MainActivity.smali
      - name: Install apktool
        run: |
          curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
      - name: Apply Kinetic home UI patch
        run: |
          mkdir -p decompiled/apktool/res/layout decompiled/apktool/res/drawable
          cp baseapk-patch/res/layout/activity_kinetic_home.xml decompiled/apktool/res/layout/
          cp baseapk-patch/res/drawable/kinetic_*.xml decompiled/apktool/res/drawable/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('decompiled/apktool/smali/com/angkin/keyflow/MainActivity.smali')
          s = p.read_text()
          old = '    :goto_10\n    return-void\n'
          new = '''    :goto_10
              invoke-virtual {p0}, Landroid/content/Context;->getResources()Landroid/content/res/Resources;
              move-result-object v0
              const-string v1, "activity_kinetic_home"
              const-string v2, "layout"
              invoke-virtual {p0}, Landroid/content/Context;->getPackageName()Ljava/lang/String;
              move-result-object v4
              invoke-virtual {v0, v1, v2, v4}, Landroid/content/res/Resources;->getIdentifier(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;)I
              move-result v3
              if-eqz v3, :home_layout_missing
              invoke-virtual {p0, v3}, Landroid/app/Activity;->setContentView(I)V
              :home_layout_missing
              return-void
          '''
          if old not in s:
              raise SystemExit('Could not locate MainActivity home content hook')
          s = s.replace(old, new, 1)
          marker = '.method public final onNewIntent(Landroid/content/Intent;)V\n'
          methods = '''.method public final onNewCompositionClick(Landroid/view/View;)V
              .locals 2
              const-string v0, "New composition"
              const/4 v1, 0x0
              invoke-static {p0, v0, v1}, Landroid/widget/Toast;->makeText(Landroid/content/Context;Ljava/lang/CharSequence;I)Landroid/widget/Toast;
              move-result-object v0
              invoke-virtual {v0}, Landroid/widget/Toast;->show()V
              return-void
          .end method

          .method public final onImportProjectClick(Landroid/view/View;)V
              .locals 3
              new-instance v0, Landroid/content/Intent;
              const-string v1, "android.intent.action.OPEN_DOCUMENT"
              invoke-direct {v0, v1}, Landroid/content/Intent;-><init>(Ljava/lang/String;)V
              const-string v1, "*/*"
              invoke-virtual {v0, v1}, Landroid/content/Intent;->setType(Ljava/lang/String;)Landroid/content/Intent;
              const-string v1, "android.intent.category.OPENABLE"
              invoke-virtual {v0, v1}, Landroid/content/Intent;->addCategory(Ljava/lang/String;)Landroid/content/Intent;
              const/16 v1, 0x1f41
              invoke-virtual {p0, v0, v1}, Landroid/app/Activity;->startActivityForResult(Landroid/content/Intent;I)V
              return-void
          .end method

          .method public final onInstallPluginClick(Landroid/view/View;)V
              .locals 3
              new-instance v0, Landroid/content/Intent;
              const-string v1, "android.intent.action.OPEN_DOCUMENT"
              invoke-direct {v0, v1}, Landroid/content/Intent;-><init>(Ljava/lang/String;)V
              const-string v1, "*/*"
              invoke-virtual {v0, v1}, Landroid/content/Intent;->setType(Ljava/lang/String;)Landroid/content/Intent;
              const-string v1, "android.intent.category.OPENABLE"
              invoke-virtual {v0, v1}, Landroid/content/Intent;->addCategory(Ljava/lang/String;)Landroid/content/Intent;
              const/16 v1, 0x1f42
              invoke-virtual {p0, v0, v1}, Landroid/app/Activity;->startActivityForResult(Landroid/content/Intent;I)V
              return-void
          .end method

          .method public final onKineticMenuClick(Landroid/view/View;)V
              .locals 2
              const-string v0, "Settings"
              const/4 v1, 0x0
              invoke-static {p0, v0, v1}, Landroid/widget/Toast;->makeText(Landroid/content/Context;Ljava/lang/CharSequence;I)Landroid/widget/Toast;
              move-result-object v0
              invoke-virtual {v0}, Landroid/widget/Toast;->show()V
              return-void
          .end method

          '''
          if marker not in s:
              raise SystemExit('Could not locate MainActivity method insertion point')
          s = s.replace(marker, methods + marker, 1)
          p.write_text(s)
          PY
      - name: Rebuild APK
        run: java -jar apktool.jar b decompiled/apktool -o kinetic-unsigned.apk
      - name: Sign APK
        run: |
          curl -L --fail -o signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar signer.jar --apks kinetic-unsigned.apk --out signed
          cp signed/kinetic-unsigned-aligned-debugSigned.apk Kinetic-baseapk-modified.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kinetic-baseapk-modified
          path: Kinetic-baseapk-modified.apk
          if-no-files-found: error
